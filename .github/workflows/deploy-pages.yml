name: Deploy to GitHub Pages

# 推送到 main 即自动构建并发布到 GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:   # 也支持在 Actions 页面手动点一次

permissions:
  contents: read
  pages: write
  id-token: write

# 同时只允许一个部署，避免排队覆盖
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 构建静态站点
        # 数据来自已提交的 public/data/*.json，无需数据库
        run: npm run build

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
