<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="./style.css">
  <!-- Octopus RUM —— 由 Rush 自动注入，请勿手动修改 -->
  <script src="https://octopus-app.zhenguanyu.com/octopus-sdk/rum/1.3.2/browser-rum.min.js" defer id="octopus-rum-sdk"></script>
  <script>
    (function () {
      var RUSH_PREVIEW_IFRAME_ID = "rush-preview-iframe";
      var REPORT_URL = "https://k79ugfzimkn5-preview.rush.zhenguanyu.com/agent/api/rum/events";
      var PROJECT_ID = "k79ugfzimkn5";

  // 同 ts 版语义，ES5 风格（html 内联脚本无构建步骤）
  var __rushCollectUrl;
  var __rushGetCollectUrl = function() {
    if (__rushCollectUrl === undefined) {
      try {
        __rushCollectUrl = new URL("https://k79ugfzimkn5-preview.rush.zhenguanyu.com/agent/api/rum/events");
      } catch (err) {
        __rushCollectUrl = null;
      }
    }
    return __rushCollectUrl;
  };

  function __rushIsCollectUrl(url) {
    var collect = __rushGetCollectUrl();
    if (!collect || !url) {
      return false;
    }
    try {
      var parsed = new URL(url, window.location.origin);
      return parsed.origin === collect.origin && parsed.pathname === collect.pathname;
    } catch (err) {
      return false;
    }
  }

      // Debug RUM 函数：把错误事件上报到 Agent API（仅在 Rush 预览 iframe 中）
      function __debugRum(event) {
        if (window.name !== RUSH_PREVIEW_IFRAME_ID || event.type !== 'error') {
          return;
        }

        try {
          fetch(REPORT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ projectId: PROJECT_ID, event: event })
          }).catch(function (err) {
            console.warn('[RUM Debug] Failed to report error:', err);
          });
        } catch (err) {
          console.warn('[RUM Debug] Failed to report error:', err);
        }
      }

      function initRum() {
        if (typeof octopusRum === 'undefined') {
          console.warn('[RUM] SDK 未加载，跳过初始化');
          return;
        }

        octopusRum.init({
          site: "octopus-ingest-cn.zhenguanyu.com",
          service: "k79ugfzimkn5",
          env: 'online',
          version: "1791629457470",
          applicationId: "48503620-12f8-499b-949c-a0d11fb29f9c",
          clientToken: "75d73372c13d4ff09633c2e6a15b6f7b",
          trackUserInteractions: true,
          trackResources: true,
          trackViewsManually: false,
          beforeSend: function (event) {
            // 过滤掉指向收集服务的事件，避免循环上报（__rushIsCollectUrl 精确匹配，
            // 旧版 indexOf 子串匹配可被绕过，见顶部注释）
            if (
              event.type === 'resource' &&
              __rushIsCollectUrl(event.resource && event.resource.url)
            ) {
              return false;
            }

            // 调用 debug 函数上报到 Agent
            __debugRum(event);

            // 返回 true 继续正常上报到 Octopus
            return true;
          }
        });
      }

      // 初始化挂在 SDK script 的 load 事件上，而不是 DOMContentLoaded：
      // defer 脚本按【文档顺序】执行，<head> 里的 SDK 必定早于 <body> 里的用户入口
      // 脚本，且 load 回调紧跟其执行。这样 RUM 在用户代码跑之前就已就绪，能接住
      // 加载期抛的错（AI 生成的静态页最典型的错误就出在这里，也是 __debugRum 回传
      // 给 AI 的那条链路）。换成 DOMContentLoaded 会晚于用户入口脚本，那类错误必然
      // 漏采；换成 async 则执行时机随网络波动，先后不再有保证。
      var sdkScript = document.getElementById("octopus-rum-sdk");

      if (typeof octopusRum !== 'undefined') {
        // SDK 已就绪（如片段被动态插入、defer 被忽略而提前执行完）
        initRum();
      } else if (sdkScript) {
        sdkScript.addEventListener('load', initRum);
        sdkScript.addEventListener('error', function () {
          console.warn('[RUM] SDK 加载失败，跳过初始化');
        });
      } else {
        console.warn('[RUM] 未找到 SDK script 标签，跳过初始化');
      }
    })();
  </script>
</head>
